name: "Build iOS Package (IPA & Simulator)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (IPA & Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build Rust Library for iOS targets
        working-directory: app
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios-sim --release

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npx tauri ios init

      - name: Build iOS Application (Tauri & Xcode)
        working-directory: app
        run: |
          npx tauri ios init
          cd src-tauri/gen/apple
          xcodebuild -project app.xcodeproj \
            -scheme app_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package iOS IPA & Simulator Artifacts
        working-directory: app
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
        run: |
          mkdir -p ios-artifacts
          TAG="${TAG_NAME}"
          
          echo "=== Locating built .app bundles ==="
          find src-tauri -name "*.app" -type d
          
          REAL_APP=""
          while IFS= read -r -d '' candidate; do
            if [ -f "$candidate/Info.plist" ] || [ -f "$candidate/TG Drive" ] || [ -f "$candidate/app" ] || [ -f "$candidate/main" ]; then
              echo "Found valid candidate: '$candidate'"
              REAL_APP="$candidate"
              break
            fi
          done < <(find src-tauri -name "*.app" -type d -print0)
          
          if [ -z "$REAL_APP" ]; then
            REAL_APP=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$REAL_APP" ] && [ -d "$REAL_APP" ]; then
            echo "Packaging Physical Device IPA from: '$REAL_APP'"
            codesign --force --deep -s - "$REAL_APP" || true
            rm -rf Payload
            mkdir -p Payload
            cp -R "$REAL_APP" Payload/
            
            echo "Payload contents:"
            ls -la Payload/
            ls -la "Payload/$(basename "$REAL_APP")"
            
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" Payload
            cp "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" "ios-artifacts/TG-Drive-${TAG}-iOS.ipa"
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$REAL_APP"
            echo "Created IPA: TG-Drive-${TAG}-iOS-Direct-Install.ipa"
          else
            echo "Error: Device .app not found!"
            exit 1
          fi
          
          echo "=== Summary of iOS Artifacts ==="
          ls -lh ios-artifacts/

      - name: Upload iOS Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: TG-Drive-${{ github.event.inputs.release_tag || 'v1.0.0' }}-iOS-Artifacts
          path: app/ios-artifacts/*

      - name: Publish iOS Release Assets
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
        run: |
          echo "Checking/creating release ${TAG_NAME}..."
          gh release create "${TAG_NAME}" --title "TG Drive ${TAG_NAME}" --notes "Official iOS Release ${TAG_NAME}" ios-artifacts/* || gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          echo "iOS release assets uploaded successfully!"
