name: "macOS & iOS Build"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to upload assets to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon ARM64
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - name: Intel x86_64
            target: x86_64-apple-darwin
            artifact_suffix: macos-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Prepare Tauri signing key if provided
        working-directory: app
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const key = (process.env.KEY || '').trim();
          if (key) {
            const b64 = key.startsWith('untrusted comment:')
              ? Buffer.from(key).toString('base64')
              : key;
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${b64}\n`);
          }

      - name: Build macOS DMG Bundle
        working-directory: app
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles dmg || true

      - name: Prepare macOS release artifacts
        working-directory: app
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p macos-artifacts
          find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" -exec cp {} "macos-artifacts/Telegram-Drive-${TAG_NAME}-${{ matrix.artifact_suffix }}.dmg" \; || true
          find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name "*.app" -exec tar -czf "macos-artifacts/Telegram-Drive-${TAG_NAME}-${{ matrix.artifact_suffix }}.app.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" "TG Drive.app" \; || true
          ls -la macos-artifacts/

      - name: Upload macOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d macos-artifacts ] && [ "$(ls -A macos-artifacts)" ]; then
            gh release upload "${TAG_NAME}" macos-artifacts/* --clobber
          else
            echo "No artifacts found to upload."
            exit 1
          fi

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build Rust Library for iOS targets
        working-directory: app
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios-sim --release

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npx tauri ios init

      - name: Build iOS Application with Xcode (Device & Simulator)
        working-directory: app
        run: |
          cd src-tauri/gen/apple
          
          if [ -d "app_iOS.xcworkspace" ]; then
            PROJECT_ARG="-workspace app_iOS.xcworkspace"
          elif [ -d "app.xcodeproj" ]; then
            PROJECT_ARG="-project app.xcodeproj"
          else
            XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            PROJECT_ARG="-project $XCODEPROJ"
          fi
          
          echo "Using Xcode target: $PROJECT_ARG"
          xcodebuild $PROJECT_ARG -list || true
          SCHEME="app_iOS"
          
          # 1. Build for Physical iOS Device (aarch64 / iphoneos)
          echo "=== Building for Physical iOS Devices (arm64 iphoneos) ==="
          xcodebuild $PROJECT_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          # 2. Build for iOS Simulator (aarch64 / iphonesimulator)
          echo "=== Building for iOS Simulator (iphonesimulator) ==="
          xcodebuild $PROJECT_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath derivedData-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build || true

      - name: Package iOS IPA & Simulator Artifacts
        working-directory: app
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p ios-artifacts
          TAG="${TAG_NAME}"
          
          DEVICE_APP=$(find src-tauri/gen/apple/derivedData-device -name "*.app" -type d | head -n 1)
          if [ -z "$DEVICE_APP" ]; then
            DEVICE_APP=$(find src-tauri -path "*Release-iphoneos*" -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$DEVICE_APP" ]; then
            DEVICE_APP=$(find src-tauri -name "*.app" -type d | head -n 1)
          fi
          
          SIM_APP=$(find src-tauri/gen/apple/derivedData-sim -name "*.app" -type d | head -n 1)
          if [ -z "$SIM_APP" ]; then
            SIM_APP=$(find src-tauri -path "*Release-iphonesimulator*" -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$DEVICE_APP" ] && [ -d "$DEVICE_APP" ]; then
            echo "Packaging Physical Device IPA from: $DEVICE_APP"
            codesign --force --deep -s - "$DEVICE_APP" || true
            rm -rf Payload
            mkdir -p Payload
            cp -R "$DEVICE_APP" Payload/
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" Payload
            cp "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" "ios-artifacts/Telegram-Drive-${TAG}-ios.ipa"
            echo "Created IPA: TG-Drive-${TAG}-iOS-Direct-Install.ipa"
          else
            echo "Error: Device .app not found!"
            exit 1
          fi
          
          if [ -n "$SIM_APP" ] && [ -d "$SIM_APP" ]; then
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$SIM_APP"
            cp "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "ios-artifacts/Telegram-Drive-${TAG}-ios-app.zip"
          elif [ -n "$DEVICE_APP" ] && [ -d "$DEVICE_APP" ]; then
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$DEVICE_APP"
            cp "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "ios-artifacts/Telegram-Drive-${TAG}-ios-app.zip"
          fi
          
          ls -lh ios-artifacts/

      - name: Upload iOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d ios-artifacts ] && [ "$(ls -A ios-artifacts)" ]; then
            gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          else
            echo "No iOS artifacts found."
            exit 1
          fi
