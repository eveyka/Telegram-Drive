name: "Build All Devices Release (PC, Android, iOS, macOS, Linux)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      clean_old_assets:
        description: 'Delete old assets from the release before uploading new ones?'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  clean-release:
    name: Prepare / Clean GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old release assets if requested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
          CLEAN: ${{ github.event.inputs.clean_old_assets != 'false' }}
        run: |
          echo "Target Release Tag: ${TAG_NAME}"
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} not found. Creating draft/published release..."
            gh release create "${TAG_NAME}" --title "Telegram Drive ${TAG_NAME}" --notes "Release ${TAG_NAME} build across PC, Android, iOS, macOS, and Linux."
          fi

          if [ "$CLEAN" = "true" ]; then
            echo "Fetching and removing previous assets for ${TAG_NAME}..."
            ASSETS=$(gh release view "${TAG_NAME}" --json assets --jq '.assets.[].name' || true)
            for asset in $ASSETS; do
              echo "Deleting old asset: $asset"
              gh release delete-asset "${TAG_NAME}" "$asset" --yes || true
            done
          fi

  build-windows:
    name: Build Windows PC (Setup & Portable)
    needs: clean-release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Prepare Windows runtime prerequisite
        shell: pwsh
        run: ./app/scripts/prepare-windows-runtime.ps1

      - name: Prepare Tauri signing key if provided
        working-directory: app
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const key = (process.env.KEY || '').trim();
          if (key) {
            const b64 = key.startsWith('untrusted comment:')
              ? Buffer.from(key).toString('base64')
              : key;
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${b64}\n`);
          }

      - name: Build Windows Tauri App (NSIS Installer & Executable)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --bundles nsis || true

      - name: Package Windows Artifacts
        shell: pwsh
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force -Path windows-artifacts
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          
          # Find NSIS installer
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination "windows-artifacts/TG-Drive-$tag-Windows-x64-Setup.exe"
            Write-Host "Found NSIS installer: $($nsis.FullName)"
          }
          
          # Find Standalone Portable Executable (app.exe or tg-drive.exe or TG Drive.exe)
          $possibleExes = @(
            "src-tauri/target/release/app.exe",
            "src-tauri/target/release/TG Drive.exe",
            "src-tauri/target/release/telegram-drive.exe"
          )
          $foundExe = $null
          foreach ($p in $possibleExes) {
            if (Test-Path $p) {
              $foundExe = $p
              break
            }
          }
          if ($foundExe) {
            Copy-Item $foundExe -Destination "windows-artifacts/TG-Drive-$tag-Windows-x64-Portable.exe"
            Write-Host "Found standalone executable: $foundExe"
          } else {
            $anyExe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
            if ($anyExe) {
              Copy-Item $anyExe.FullName -Destination "windows-artifacts/TG-Drive-$tag-Windows-x64-Portable.exe"
              Write-Host "Copied fallback exe: $($anyExe.FullName)"
            }
          }

          Get-ChildItem windows-artifacts

      - name: Upload Windows Artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "${{ env.TAG_NAME }}" windows-artifacts/* --clobber

  build-android:
    name: Build Android (APK)
    needs: clean-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 30.0.14904198
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android SDK and NDK components
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Initialize & Build Android Release APK
        working-directory: app
        run: |
          npm run tauri android init || true
          npm run tauri android build || true

      - name: Package Android Artifacts
        working-directory: app
        run: |
          mkdir -p android-artifacts
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          
          # Find all APKs
          find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*.apk" -exec cp {} "android-artifacts/TG-Drive-${TAG}-Android-ARM64.apk" \; || true
          find src-tauri/gen/android/app/build/outputs/apk -name "*universal*.apk" -exec cp {} "android-artifacts/TG-Drive-${TAG}-Android-Universal.apk" \; || true
          
          # If specific naming wasn't matched, pick the largest release apk
          if [ -z "$(ls -A android-artifacts)" ]; then
            FALLBACK_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
            if [ -n "$FALLBACK_APK" ]; then
              cp "$FALLBACK_APK" "android-artifacts/TG-Drive-${TAG}-Android.apk"
            fi
          fi
          
          ls -la android-artifacts/

      - name: Upload Android Artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d android-artifacts ] && [ "$(ls -A android-artifacts)" ]; then
            gh release upload "${TAG_NAME}" android-artifacts/* --clobber
          fi

  build-macos:
    name: Build macOS (${{ matrix.name }})
    needs: clean-release
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon ARM64
            target: aarch64-apple-darwin
            artifact_name: macOS-Apple-Silicon-ARM64
          - name: Intel x64
            target: x86_64-apple-darwin
            artifact_name: macOS-Intel-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build macOS DMG Bundle
        working-directory: app
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles dmg || true

      - name: Package macOS release artifacts
        working-directory: app
        run: |
          mkdir -p macos-artifacts
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" -exec cp {} "macos-artifacts/TG-Drive-${TAG}-${{ matrix.artifact_name }}.dmg" \; || true
          ls -la macos-artifacts/

      - name: Upload macOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d macos-artifacts ] && [ "$(ls -A macos-artifacts)" ]; then
            gh release upload "${TAG_NAME}" macos-artifacts/* --clobber
          fi

  build-ios:
    name: Build iOS Package (IPA & Simulator)
    needs: clean-release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build Rust Library for iOS targets
        working-directory: app
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios-sim --release

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npx tauri ios init

      - name: Build iOS Application with Xcode (Device & Simulator)
        working-directory: app
        run: |
          cd src-tauri/gen/apple
          
          # Find project or workspace
          if [ -d "app_iOS.xcworkspace" ]; then
            PROJECT_ARG="-workspace app_iOS.xcworkspace"
          elif [ -d "app.xcodeproj" ]; then
            PROJECT_ARG="-project app.xcodeproj"
          else
            XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            PROJECT_ARG="-project $XCODEPROJ"
          fi
          
          echo "Using Xcode target: $PROJECT_ARG"
          xcodebuild $PROJECT_ARG -list || true
          SCHEME="app_iOS"
          
          # 1. Build for Physical iOS Device (aarch64 / iphoneos)
          echo "=== Building for Physical iOS Devices (arm64 iphoneos) ==="
          xcodebuild $PROJECT_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          # 2. Build for iOS Simulator (aarch64 / iphonesimulator)
          echo "=== Building for iOS Simulator (iphonesimulator) ==="
          xcodebuild $PROJECT_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath derivedData-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build || true

      - name: Package iOS IPA & Simulator Artifacts
        working-directory: app
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p ios-artifacts
          TAG="${TAG_NAME}"
          
          echo "=== Locating built .app bundles ==="
          find src-tauri -name "*.app" -type d
          
          # 1. Device App (.app for physical iPhone)
          DEVICE_APP=$(find src-tauri/gen/apple/derivedData-device -name "*.app" -type d | head -n 1)
          if [ -z "$DEVICE_APP" ]; then
            DEVICE_APP=$(find src-tauri -path "*Release-iphoneos*" -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$DEVICE_APP" ]; then
            DEVICE_APP=$(find src-tauri -name "*.app" -type d | head -n 1)
          fi
          
          # 2. Simulator App (.app for iOS Simulator)
          SIM_APP=$(find src-tauri/gen/apple/derivedData-sim -name "*.app" -type d | head -n 1)
          if [ -z "$SIM_APP" ]; then
            SIM_APP=$(find src-tauri -path "*Release-iphonesimulator*" -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$DEVICE_APP" ] && [ -d "$DEVICE_APP" ]; then
            echo "Packaging Physical Device IPA from: $DEVICE_APP"
            
            # Ad-hoc sign the bundle for sideloading support (AltStore, TrollStore, SideStore, Sideloadly, Scarlet, Feather)
            codesign --force --deep -s - "$DEVICE_APP" || true
            
            rm -rf Payload
            mkdir -p Payload
            cp -R "$DEVICE_APP" Payload/
            
            # Package IPA
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" Payload
            cp "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" "ios-artifacts/TG-Drive-${TAG}-iOS.ipa"
            echo "Created IPA: TG-Drive-${TAG}-iOS-Direct-Install.ipa"
          else
            echo "Error: Device .app not found!"
            exit 1
          fi
          
          if [ -n "$SIM_APP" ] && [ -d "$SIM_APP" ]; then
            echo "Packaging Simulator bundle from: $SIM_APP"
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$SIM_APP"
            echo "Created Simulator zip: TG-Drive-${TAG}-iOS-Simulator-App.zip"
          elif [ -n "$DEVICE_APP" ] && [ -d "$DEVICE_APP" ]; then
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$DEVICE_APP"
          fi
          
          echo "=== Summary of iOS Artifacts ==="
          ls -lh ios-artifacts/

      - name: Upload iOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d ios-artifacts ] && [ "$(ls -A ios-artifacts)" ]; then
            gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          fi

  build-linux:
    name: Build Linux PC (Debian & AppImage)
    needs: clean-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build Linux Tauri App (deb, appimage)
        working-directory: app
        run: |
          npm run tauri build -- --bundles deb,appimage || true

      - name: Package Linux Artifacts
        working-directory: app
        run: |
          mkdir -p linux-artifacts
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} "linux-artifacts/TG-Drive-${TAG}-Linux-x64.deb" \; || true
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} "linux-artifacts/TG-Drive-${TAG}-Linux-x64.AppImage" \; || true
          ls -la linux-artifacts/

      - name: Upload Linux Artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d linux-artifacts ] && [ "$(ls -A linux-artifacts)" ]; then
            gh release upload "${TAG_NAME}" linux-artifacts/* --clobber
          fi
